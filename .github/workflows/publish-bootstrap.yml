name: Publish recovered MethodBridge bootstrap

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out temporary transport branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify, restore, validate, and publish the recovered bootstrap
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/chunk-checksums.txt <<'EOF'
          b00123c1779f6ca7947c5c68b42a2389bbbc66e961604553d951d56ad251f8d2  .bootstrap/chunk-00.b64
          cf9176e57c18ce675dec0a75150e8885638c179387b0c7653e83e05c50b62625  .bootstrap/chunk-01.b64
          33489908a4dadef89dc05e9509f9e629769a3990a3dd0996c576e6cd8d1e3c31  .bootstrap/chunk-02.b64
          df4068362120e7ed271082feac92f5fcfb895f78e46894961f11283e7b01754a  .bootstrap/chunk-03.b64
          5ee400b1fb274fb51f431a5a93ea02ac833137654949718286b920d13cbc4703  .bootstrap/chunk-04.b64
          62abef5c0fb523d10328dfda085898cd99fca132fd0049863ce380cf73c10288  .bootstrap/chunk-05.b64
          91d0604ee605561362b6e8ca1c15ac5ab946336ccba2fcd824cb9d9b17601871  .bootstrap/chunk-06.b64
          6903e2df4f816f9e29b94437054970dc7ac2a83667cb30163a458e5ebb4b3cc0  .bootstrap/chunk-07.b64
          cc6f85e315c3891120434f905a0cbbfa9f5670d2c70edbe39ec918452cbdfbd3  .bootstrap/chunk-08.b64
          009f336e9dbf86d3f64e0febc236b00c5931d587649a0af39ae97d5ed499c929  .bootstrap/chunk-09.b64
          b9c3a639095b12e6c3a6d12498a03cb5b8a1a8561df76fd3b2bf26bb801724c1  .bootstrap/chunk-10.b64
          d75a52245bc4677b0537204c8bfbbe2d1ec649cf9d1433c8e144dc973572a609  .bootstrap/chunk-11.b64
          d876205b7763ea4dca079f8e4578b538beb3a4acdad58fcd224f4a16e5c77737  .bootstrap/chunk-12a.b64
          678bb9054659945a156e8dcbb6549af8d6efaf750ffa2e1c8eb7d0fb0f2214f8  .bootstrap/chunk-12b.b64
          091000ebac6af9f58d7d59c5b79ad7c01d6936fa8247e55ed87359dc7f63aec2  .bootstrap/chunk-13.b64
          6c46846b329e30b6c8302c6c926e0fbb5cf8d0044f966f8f880ef66b490dcc46  .bootstrap/chunk-14a.b64
          b5e7fdde375b116b9d347a1d736105ab7a39b306f882cc0a4e43a9fa34e607fa  .bootstrap/chunk-14b.b64
          09322544d44ed31e38d4dee90bb4cb41a210ca676a20e026ffc15eafc740d2f6  .bootstrap/chunk-15.b64
          EOF
          sha256sum --check /tmp/chunk-checksums.txt

          {
            cat .bootstrap/chunk-00.b64
            cat .bootstrap/chunk-01.b64
            cat .bootstrap/chunk-02.b64
            cat .bootstrap/chunk-03.b64
            cat .bootstrap/chunk-04.b64
            cat .bootstrap/chunk-05.b64
            cat .bootstrap/chunk-06.b64
            cat .bootstrap/chunk-07.b64
            cat .bootstrap/chunk-08.b64
            cat .bootstrap/chunk-09.b64
            cat .bootstrap/chunk-10.b64
            cat .bootstrap/chunk-11.b64
            cat .bootstrap/chunk-12a.b64
            cat .bootstrap/chunk-12b.b64
            cat .bootstrap/chunk-13.b64
            cat .bootstrap/chunk-14a.b64
            cat .bootstrap/chunk-14b.b64
            cat .bootstrap/chunk-15.b64
          } | tr -d '\n\r\t ' > /tmp/methodbridge.bundle.b64

          test "$(sha256sum /tmp/methodbridge.bundle.b64 | awk '{print $1}')" = \
            "6a42f594eee5c9cf40785cf26b780c73996e17d3a909579e2d3ccef846eee182"

          base64 --decode /tmp/methodbridge.bundle.b64 > /tmp/methodbridge.bundle
          test "$(sha256sum /tmp/methodbridge.bundle | awk '{print $1}')" = \
            "985864d69ea2a9e335af357ad15dd797c411c334e6d96198c4d6441acb002e50"

          git bundle verify /tmp/methodbridge.bundle
          git fetch /tmp/methodbridge.bundle main:refs/remotes/bootstrap/main
          test "$(git rev-parse refs/remotes/bootstrap/main)" = \
            "4e621024382930666e823e4783be6fdfe806f87e"

          git reset --hard refs/remotes/bootstrap/main
          git clean -fdx

          test "$(git rev-parse HEAD)" = \
            "4e621024382930666e823e4783be6fdfe806f87e"
          test "$(git ls-files | wc -l | tr -d ' ')" = "279"

          python3 scripts/validate_repository.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push --force origin HEAD:main
          git tag -f -a v0.1.0-bootstrap \
            -m "MethodBridge Local repository bootstrap 0.1.0"
          git push --force origin refs/tags/v0.1.0-bootstrap
