name: Repository integrity
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/validate_markdown_links.py
      - run: python scripts/validate_repository.py
      - run: python scripts/validate_sources.py
      - run: python scripts/validate_dataset.py
      - run: python scripts/detect_train_eval_leakage.py
      - run: python scripts/run_evaluation.py --dry-run
      - run: python -m pytest -q
