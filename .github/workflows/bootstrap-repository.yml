name: Expand MethodBridge bootstrap

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  expand:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconstruct and verify archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunk_*.txt > /tmp/methodbridge.tar.xz.b64
          base64 --decode /tmp/methodbridge.tar.xz.b64 > /tmp/methodbridge.tar.xz
          echo "831c6c948331d74c221d901b605b4fab6dc108692af2b622e928b3cf660b770c  /tmp/methodbridge.tar.xz" | sha256sum --check --strict
          mkdir -p /tmp/methodbridge
          tar -xJf /tmp/methodbridge.tar.xz -C /tmp/methodbridge

      - name: Expand repository tree
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' /tmp/methodbridge/ ./

      - name: Validate populated bootstrap
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python scripts/validate_repository.py
          python scripts/validate_sources.py
          python scripts/validate_dataset.py
          python scripts/detect_train_eval_leakage.py
          python scripts/run_evaluation.py --dry-run
          python -m pytest -q

      - name: Commit populated repository to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No source changes to publish.'; exit 1; }
          git commit -m 'Publish MethodBridge Local repository bootstrap'
          git push origin HEAD:main
