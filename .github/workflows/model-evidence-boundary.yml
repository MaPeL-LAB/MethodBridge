name: Model evidence boundary

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'

      - name: Validate evidence, campaign, public claims, and release gates
        run: |
          python scripts/validate_model_evidence_boundary.py
          python scripts/validate_local_model_campaign.py
          python scripts/validate_public_claims.py
          python scripts/verify_local_model_handoff.py

      - name: Run evidence and governance regressions
        run: |
          python -m pytest -q \
            tests/inference/test_evidence_boundary.py \
            tests/inference/test_router.py \
            tests/governance/test_model_evidence_status.py \
            tests/governance/test_public_claims_gate.py \
            tests/model_engineering \
            tests/unit/test_readiness.py

      - name: Verify tracked manifest freshness
        if: >-
          github.event_name == 'pull_request' ||
          github.ref_name == 'main' ||
          github.actor == 'github-actions[bot]'
        run: |
          python scripts/build_manifest.py --write
          git diff --exit-code -- MANIFEST.json

  refresh-agent-manifest:
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref_name, 'agent/') &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh deterministic manifest
        run: python scripts/build_manifest.py --write

      - name: Commit manifest when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- MANIFEST.json; then
            echo 'MANIFEST.json is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MANIFEST.json
          git commit -m 'Refresh manifest for pre-local model campaign'
          git push origin HEAD:${GITHUB_REF_NAME}
