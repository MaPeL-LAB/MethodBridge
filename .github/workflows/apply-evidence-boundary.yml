name: Apply evidence-boundary restoration

on:
  push:
    branches:
      - agent/restore-fail-closed-evidence-boundary
    paths:
      - '.evidence-restore/**'
      - '.github/workflows/apply-evidence-boundary.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconstruct and verify correction package
        shell: bash
        run: |
          set -euo pipefail
          cat .evidence-restore/chunk-* > /tmp/evidence_patch.b64
          base64 --decode /tmp/evidence_patch.b64 > /tmp/evidence_patch.tar.gz
          echo '9ab8e2bbb2a656cef1bedc8924bbccaddf237a32809f0ac388b33e3cb4fb7851  /tmp/evidence_patch.tar.gz' | sha256sum -c -
          tar -xzf /tmp/evidence_patch.tar.gz -C .
          rm -rf .evidence-restore
          rm -f .github/workflows/apply-evidence-boundary.yml

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Validate fail-closed boundary
        run: |
          python scripts/validate_model_evidence_boundary.py
          python scripts/validate_repository.py
          python scripts/run_evaluation.py --dry-run
          python -m pytest -q \
            tests/inference/test_evidence_boundary.py \
            tests/inference/test_router.py \
            tests/governance/test_model_evidence_status.py \
            tests/unit/test_readiness.py
          python scripts/build_manifest.py --write
          git diff --check

      - name: Commit restored boundary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restore fail-closed model evidence boundary'
          git push origin HEAD:agent/restore-fail-closed-evidence-boundary
